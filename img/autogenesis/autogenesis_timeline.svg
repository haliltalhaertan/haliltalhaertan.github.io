<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" role="img" aria-label="Autogenesis research timeline, September to November 2026"><title>Autogenesis research timeline, September to November 2026</title><rect width="760" height="500" fill="#ffffff"/><line x1="170" y1="40" x2="170" y2="420" stroke="#d9e1df" stroke-width="3"/><circle cx="170" cy="40" r="10" fill="#146b69" stroke="#fff" stroke-width="3"/><text x="148" y="45" font-size="13.5" text-anchor="end" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Sep 2026</text><text x="196" y="45" font-size="15.5" fill="#172d35" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">U0 study written up</text><text x="196" y="67" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">An exact census finds one minimal 2-bit register; code and claim ledger made</text><text x="196" y="85" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">public.</text><circle cx="170" cy="135" r="10" fill="#8a9c9a" stroke="#fff" stroke-width="3"/><text x="148" y="140" font-size="13.5" text-anchor="end" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">14–20 Oct</text><text x="196" y="140" font-size="15.5" fill="#172d35" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Energy-reading bonds (U1)</text><text x="196" y="162" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Searches for switches and latches that the energy itself would hold. Mostly</text><text x="196" y="180" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">negative: no real energy barriers, no write/erase cycles.</text><circle cx="170" cy="230" r="10" fill="#146b69" stroke="#fff" stroke-width="3"/><text x="148" y="235" font-size="13.5" text-anchor="end" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">20–21 Oct</text><text x="196" y="235" font-size="15.5" fill="#172d35" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Self-repairing networks</text><text x="196" y="257" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Hand-proved designs: FAST40 repairs 3 faults in 4 steps, FAST65 in 3. A size bound</text><text x="196" y="275" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">within one design family.</text><circle cx="170" cy="325" r="10" fill="#8a9c9a" stroke="#fff" stroke-width="3"/><text x="148" y="330" font-size="13.5" text-anchor="end" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">21 Oct – 2 Nov</text><text x="196" y="330" font-size="15.5" fill="#172d35" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Automated checking</text><text x="196" y="352" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Long automated audit phase. A finite test of 86,436 cases on a related setting</text><text x="196" y="370" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">passed; a technology gate stayed inconclusive.</text><circle cx="170" cy="420" r="10" fill="#d7aa67" stroke="#fff" stroke-width="3"/><text x="148" y="425" font-size="13.5" text-anchor="end" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">3 Nov</text><text x="196" y="425" font-size="15.5" fill="#172d35" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Independent re-check</text><text x="196" y="447" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">FAST40 simulated from its written definition: 21,400 of 21,400 cases repaired</text><text x="196" y="465" font-size="13" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">within 4 steps.</text></svg>