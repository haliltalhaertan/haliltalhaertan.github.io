<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" role="img" aria-label="Repair time distribution of FAST40"><title>Repair time distribution of FAST40</title><rect width="960" height="420" fill="#ffffff"/><text x="20" y="34" font-size="16" fill="#172d35" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">How fast does FAST40 repair itself? Every case checked, both stored patterns.</text><text x="176" y="92" font-size="14" text-anchor="end" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">1 node flipped</text><text x="176" y="110" font-size="11.5" text-anchor="end" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">80 cases</text><rect x="190.00" y="70" width="470.00" height="44" fill="#0e4f4e"/><text x="674" y="89" font-size="13" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">all repaired</text><text x="674" y="107" font-size="13" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">within 4 steps</text><text x="176" y="162" font-size="14" text-anchor="end" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">2 nodes flipped</text><text x="176" y="180" font-size="11.5" text-anchor="end" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">1,560 cases</text><rect x="190.00" y="140" width="390.46" height="44" fill="#0e4f4e"/><rect x="580.46" y="140" width="72.31" height="44" fill="#146b69"/><rect x="652.77" y="140" width="7.23" height="44" fill="#4f9a95"/><text x="674" y="159" font-size="13" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">all repaired</text><text x="674" y="177" font-size="13" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">within 4 steps</text><text x="176" y="232" font-size="14" text-anchor="end" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">3 nodes flipped</text><text x="176" y="250" font-size="11.5" text-anchor="end" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">19,760 cases</text><rect x="190.00" y="210" width="281.24" height="44" fill="#0e4f4e"/><rect x="471.24" y="210" width="159.03" height="44" fill="#146b69"/><rect x="630.27" y="210" width="22.60" height="44" fill="#4f9a95"/><rect x="652.86" y="210" width="7.14" height="44" fill="#9cc9c2"/><text x="674" y="229" font-size="13" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">all repaired</text><text x="674" y="247" font-size="13" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">within 4 steps</text><text x="176" y="302" font-size="14" text-anchor="end" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">4 nodes flipped</text><text x="176" y="320" font-size="11.5" text-anchor="end" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">182,780 cases</text><rect x="190.00" y="280" width="169.12" height="44" fill="#0e4f4e"/><rect x="359.12" y="280" width="235.61" height="44" fill="#146b69"/><rect x="594.73" y="280" width="43.72" height="44" fill="#4f9a95"/><rect x="638.45" y="280" width="18.92" height="44" fill="#9cc9c2"/><rect x="657.37" y="280" width="2.02" height="44" fill="#d7aa67"/><rect x="659.38" y="280" width="1.50" height="44" fill="#c2412d"/><text x="674" y="299" font-size="13" fill="#c2412d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">99.4% within 4 steps</text><text x="674" y="317" font-size="13" fill="#c2412d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">240 cases never repaired</text><rect x="190" y="356" width="14" height="14" fill="#0e4f4e"/><text x="210" y="368" font-size="12.5" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">1 step</text><rect x="268.0" y="356" width="14" height="14" fill="#146b69"/><text x="288.0" y="368" font-size="12.5" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">2 steps</text><rect x="353.0" y="356" width="14" height="14" fill="#4f9a95"/><text x="373.0" y="368" font-size="12.5" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">3 steps</text><rect x="438.0" y="356" width="14" height="14" fill="#9cc9c2"/><text x="458.0" y="368" font-size="12.5" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">4 steps</text><rect x="523.0" y="356" width="14" height="14" fill="#d7aa67"/><text x="543.0" y="368" font-size="12.5" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">more than 4 steps</text><rect x="678.0" y="356" width="14" height="14" fill="#c2412d"/><text x="698.0" y="368" font-size="12.5" fill="#172d35" font-family="system-ui,-apple-system,Segoe UI,sans-serif">not repaired</text><text x="190" y="398" font-size="12.5" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Up to three flipped nodes: always repaired, and no bond ever breaks.</text><text x="190" y="416" font-size="12.5" fill="#53676c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">With four, a few cases break a bond or settle into a wrong pattern, so the guarantee stops at three.</text></svg>