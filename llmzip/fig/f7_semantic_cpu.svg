<title id="t">Semantic hybrid CPU cost versus the allowed cap</title><desc id="d">Composed cold CPU ratio against baseline: 1 thread 138.5x, 2 threads 173.3x, 4 threads 234.4x. The allowed cap was 5x.</desc>
