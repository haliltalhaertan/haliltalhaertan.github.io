<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="t">Reader model change versus search changes</title><desc id="d">On 250 LongMemEval-S questions with the same inputs, changing the reader model (and its reasoning setting) moved QA accuracy from 55% to 82%. Query expansion on 250 unseen questions: 207 versus 205 correct, gain not confirmed.</desc>
<rect width="760" height="250" fill="#fff"/>
<text x="24.0" y="30.0" font-size="15" fill="#172d35" text-anchor="start" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke">What moved answer accuracy the most (LongMemEval-S, 250 questions)</text>
<line x1="254.0" y1="56.0" x2="254.0" y2="144.0" stroke="#d9e1df" stroke-width="1" />
<text x="254.0" y="162.0" font-size="11" fill="#53676c" text-anchor="middle" font-weight="400" >0%</text>
<line x1="364.0" y1="56.0" x2="364.0" y2="144.0" stroke="#d9e1df" stroke-width="1" />
<text x="364.0" y="162.0" font-size="11" fill="#53676c" text-anchor="middle" font-weight="400" >25%</text>
<line x1="474.0" y1="56.0" x2="474.0" y2="144.0" stroke="#d9e1df" stroke-width="1" />
<text x="474.0" y="162.0" font-size="11" fill="#53676c" text-anchor="middle" font-weight="400" >50%</text>
<line x1="584.0" y1="56.0" x2="584.0" y2="144.0" stroke="#d9e1df" stroke-width="1" />
<text x="584.0" y="162.0" font-size="11" fill="#53676c" text-anchor="middle" font-weight="400" >75%</text>
<line x1="694.0" y1="56.0" x2="694.0" y2="144.0" stroke="#d9e1df" stroke-width="1" />
<text x="694.0" y="162.0" font-size="11" fill="#53676c" text-anchor="middle" font-weight="400" >100%</text>
<text x="242.0" y="75.0" font-size="13" fill="#172d35" text-anchor="end" font-weight="600" >older reader</text>
<text x="242.0" y="90.0" font-size="11" fill="#53676c" text-anchor="end" font-weight="400" >same inputs</text>
<rect x="254.0" y="62.0" width="242.0" height="30.0" rx="3" fill="#a9b6b4" />
<text x="504.0" y="82.0" font-size="13" fill="#172d35" text-anchor="start" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke">55%</text>
<text x="242.0" y="121.0" font-size="13" fill="#172d35" text-anchor="end" font-weight="600" >newer reader</text>
<text x="242.0" y="136.0" font-size="11" fill="#53676c" text-anchor="end" font-weight="400" >model + reasoning setting changed</text>
<rect x="254.0" y="108.0" width="360.8" height="30.0" rx="3" fill="#146b69" />
<text x="622.8" y="128.0" font-size="13" fill="#172d35" text-anchor="start" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke">82%</text>
<text x="24.0" y="200.0" font-size="13" fill="#172d35" text-anchor="start" font-weight="600" >By contrast, a search change (query expansion) on 250 unseen questions:</text>
<text x="24.0" y="224.0" font-size="12.5" fill="#53676c" text-anchor="start" font-weight="400" >207 vs 205 correct → gain not confirmed.  Better search did not translate into better answers in the versions tested.</text>
</svg>