<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>Diagram: ordinary compression versus growing a file from a small seed with a fixed rule.</title><rect width="800" height="340" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" text-anchor="start" font-weight="600" fill="#172d35">The idea: keep a tiny seed, and let a fixed rule grow the file back</text><text x="24.0" y="70.0" font-size="12" text-anchor="start" font-weight="700" fill="#53676c">Usual compression</text><rect x="24.0" y="84.0" width="190.0" height="44.0" rx="6" fill="#f5f6f2" stroke="#53676c" stroke-width="1" /><text x="119.0" y="111.0" font-size="13" text-anchor="middle" font-weight="400" fill="#172d35">your file</text><line x1="222.0" y1="106.0" x2="302.0" y2="106.0" stroke="#146b69" stroke-width="2"/><polygon points="302,100 312,106 302,112" fill="#146b69"/><text x="261.0" y="96.0" font-size="12" text-anchor="middle" font-weight="600" fill="#146b69">zip</text><rect x="318.0" y="90.0" width="96.0" height="32.0" rx="6" fill="#146b69" stroke="none" stroke-width="1" /><text x="366.0" y="111.0" font-size="12" text-anchor="middle" font-weight="600" fill="#fff">smaller file</text><text x="436.0" y="111.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">Finds repeats and patterns in the data itself.</text><text x="24.0" y="162.0" font-size="12" text-anchor="start" font-weight="700" fill="#c47a1c">ZipGenesis idea</text><rect x="24.0" y="190.0" width="58.0" height="32.0" rx="6" fill="#c47a1c" stroke="none" stroke-width="1" /><text x="53.0" y="211.0" font-size="12" text-anchor="middle" font-weight="700" fill="#fff">seed</text><text x="53.0" y="240.0" font-size="11" text-anchor="middle" font-weight="400" fill="#53676c">a few bytes</text><line x1="90.0" y1="206.0" x2="152.0" y2="206.0" stroke="#c47a1c" stroke-width="2"/><polygon points="152,200 162,206 152,212" fill="#c47a1c"/><text x="126.0" y="194.0" font-size="11" text-anchor="middle" font-weight="400" fill="#53676c">same rule</text><text x="126.0" y="226.0" font-size="11" text-anchor="middle" font-weight="400" fill="#53676c">every time</text><defs><pattern id="g" width="8.2" height="8.2" patternUnits="userSpaceOnUse"><rect width="6.999999999999999" height="6.999999999999999" fill="#eef1ee"/></pattern></defs><rect x="172.0" y="158.0" width="254.2" height="98.4" rx="0" fill="url(#g)" stroke="none" stroke-width="1" /><rect x="295.0" y="158.0" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="286.8" y="166.2" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="303.2" y="166.2" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="278.6" y="174.4" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="311.4" y="174.4" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="270.4" y="182.6" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="286.8" y="182.6" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="303.2" y="182.6" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="319.6" y="182.6" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="262.2" y="190.8" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="327.8" y="190.8" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="254.0" y="199.0" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="270.4" y="199.0" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1" /><rect x="319.6" y="199.0" width="7.0" height="7.0" rx="0" fill="#c47a1c" stroke="none" stroke-width="1"