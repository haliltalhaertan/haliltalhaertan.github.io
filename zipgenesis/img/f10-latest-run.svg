<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 272" width="800" height="272" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>Diverging bars: +616 bytes on air quality, -871 bytes on wine; output exceeded limit by 79,584 bytes.</title><rect width="800" height="272" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" text-anchor="start" font-weight="600" fill="#172d35">Latest run: helped on air quality, hurt on wine, and broke its own size limit</text><line x1="400.0" y1="62.0" x2="400.0" y2="150.0" stroke="#53676c" stroke-width="1"/><text x="392.0" y="58.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#53676c">← new method bigger</text><text x="408.0" y="58.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#53676c">new method smaller →</text><rect x="400.0" y="86.0" width="198.0" height="20.0" rx="2" fill="#3a6ea5" stroke="none" stroke-width="1" /><text x="390.0" y="101.0" font-size="13" text-anchor="end" font-weight="600" fill="#172d35">Air quality</text><text x="606.0" y="101.0" font-size="12" text-anchor="start" font-weight="400" fill="#172d35">616 bytes smaller</text><rect x="120.0" y="126.0" width="280.0" height="20.0" rx="2" fill="#6f8183" stroke="none" stroke-width="1" /><text x="410.0" y="141.0" font-size="13" text-anchor="start" font-weight="600" fill="#172d35">Wine quality</text><text x="112.0" y="141.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">871 bytes bigger</text><text x="24.0" y="178.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#53676c">Size of everything the run wrote, against the limit it set for itself</text><rect x="24.0" y="190.0" width="600.0" height="22.0" rx="3" fill="#e6ebe9" stroke="none" stroke-width="1" /><rect x="24.0" y="190.0" width="600.0" height="22.0" rx="3" fill="none" stroke="#53676c" stroke-width="1" /><rect x="624.0" y="190.0" width="4.0" height="22.0" rx="0" fill="#b5473a" stroke="none" stroke-width="1" /><text x="638.0" y="206.0" font-size="12" text-anchor="start" font-weight="600" fill="#b5473a">over by 79,584 bytes</text><text x="30.0" y="230.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#53676c">limit: 12,582,912 bytes (12 MiB)</text><text x="24.0" y="258.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#53676c">Because of the limit breach the run counts as failed; its numbers are kept only as diagnostics.</text></svg>