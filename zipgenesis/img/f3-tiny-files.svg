<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" width="800" height="368" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>Bar chart of packet sizes for a 4-byte and a 5-byte file.</title><rect width="800" height="368" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" text-anchor="start" font-weight="600" fill="#172d35">On tiny files, every packet is far bigger than the file itself</text><text x="24.0" y="66.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#53676c">A 4-byte file (test ZG-010)</text><text x="224.0" y="91.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">the file itself</text><rect x="234.0" y="78.0" width="24.2" height="17.0" rx="2" fill="#f5f6f2" stroke="#53676c" stroke-width="1.2" /><text x="265.2" y="91.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">4 bytes</text><text x="224.0" y="119.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">grown from a seed</text><rect x="234.0" y="106.0" width="218.0" height="17.0" rx="2" fill="#c47a1c" stroke="none" stroke-width="1" /><text x="459.0" y="119.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">36 bytes</text><text x="224.0" y="147.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">stored as-is in a packet</text><rect x="234.0" y="134.0" width="230.1" height="17.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="471.1" y="147.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">38 bytes</text><text x="24.0" y="186.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#53676c">A 5-byte file (test ZG-020)</text><text x="224.0" y="211.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">the file itself</text><rect x="234.0" y="198.0" width="30.3" height="17.0" rx="2" fill="#f5f6f2" stroke="#53676c" stroke-width="1.2" /><text x="271.3" y="211.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">5 bytes</text><text x="224.0" y="239.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">picked directly from a list</text><rect x="234.0" y="226.0" width="212.0" height="17.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="453.0" y="239.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">35 bytes</text><text x="224.0" y="267.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">grown from a seed</text><rect x="234.0" y="254.0" width="224.1" height="17.0" rx="2" fill="#c47a1c" stroke="none" stroke-width="1" /><text x="465.1" y="267.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">37 bytes</text><text x="224.0" y="295.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">stored as-is in a packet</text><rect x="234.0" y="282.0" width="236.2" height="17.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="477.2" y="295.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">39 bytes</text><text x="224.0" y="323.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">zlib (ordinary zip)</text><rect x="234.0" y="310.0" width="430.0" height="17.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="671.0" y="323.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">71 bytes</text><text x="24.0" y="354.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#53676c">Each packet carries a fixed header of about 32 bytes, so none of the options can shrink a file this small.</text></svg>