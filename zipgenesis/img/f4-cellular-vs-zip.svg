<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 378" width="800" height="378" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>Bar chart: cellular prediction totals 14,297 bytes versus 6,911 for ordinary compressors on 20 files.</title><rect width="800" height="378" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" text-anchor="start" font-weight="600" fill="#172d35">Cellular guess + fix-ups lost on all 20 test files: about twice the size of zlib</text><text x="276.0" y="71.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">best ordinary mix + repeat trick</text><rect x="286.0" y="58.0" width="111.1" height="17.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="404.1" y="71.0" font-size="12" text-anchor="start" font-weight="600" fill="#172d35">6,903 bytes  ← best</text><text x="276.0" y="100.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">best of raw / zlib / Zstandard</text><rect x="286.0" y="87.0" width="111.2" height="17.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="404.2" y="100.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">6,911 bytes</text><text x="276.0" y="129.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">zlib</text><rect x="286.0" y="116.0" width="115.7" height="17.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="408.7" y="129.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">7,192 bytes</text><text x="276.0" y="158.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">Zstandard</text><rect x="286.0" y="145.0" width="118.8" height="17.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="411.8" y="158.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">7,385 bytes</text><text x="276.0" y="187.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">guess “all zeros” + fix-ups</text><rect x="286.0" y="174.0" width="146.9" height="17.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="439.9" y="187.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">9,132 bytes</text><text x="276.0" y="216.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">guess “same as last block” + fix-ups</text><rect x="286.0" y="203.0" width="151.8" height="17.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="444.8" y="216.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">9,435 bytes</text><text x="276.0" y="245.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">fixed patterns + fix-ups</text><rect x="286.0" y="232.0" width="172.9" height="17.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="465.9" y="245.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">10,747 bytes</text><text x="276.0" y="274.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">no compression</text><rect x="286.0" y="261.0" width="217.6" height="17.0" rx="2" fill="#f5f6f2" stroke="#53676c" stroke-width="1.2" /><text x="510.6" y="274.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">13,524 bytes</text><text x="276.0" y="303.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">cellular guess + fix-ups</text><rect x="286.0" y="290.0" width="230.0" height="17.0" rx="2" fill="#c47a1c" stroke="none" stroke-width="1" /><text x="523.0" y="303.0" font-size="12" text-anchor="start" font-weight="600" fill="#172d35">14,297 bytes  ← used 0 of 20 times</text><text x="276.0" y="332.0" font-size="13" text-anchor="end" font-weight="400" fill="#172d35">lookup table with the same guesses</text><rect x="286.0" y="319.0" width="230.0" height="17.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="523.0" y="332.0" font-size="12" text-anchor="start" font-weight="600" fill="#172d35">14,297 bytes  same size as cellular</text><text x="24.0" y="366.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#53676c">Total bytes for 20 practice files (ZG-040). Shorter bar = better compression.</text></svg>