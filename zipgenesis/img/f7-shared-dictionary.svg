<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>Bar chart of total bytes for 256 blocks with and without a shared dictionary.</title><rect width="800" height="220" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" text-anchor="start" font-weight="600" fill="#172d35">A shared dictionary helps small blocks, but zipping all together is smaller</text><text x="314.0" y="74.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">separate, no shared dictionary</text><rect x="324.0" y="60.0" width="250.0" height="19.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="581.0" y="74.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">330,492 bytes</text><text x="314.0" y="106.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">separate + shared dictionary</text><rect x="324.0" y="92.0" width="221.2" height="19.0" rx="2" fill="#3a6ea5" stroke="none" stroke-width="1" /><text x="552.2" y="106.0" font-size="12" text-anchor="start" font-weight="600" fill="#172d35">292,415 bytes  ZipGenesis tricks</text><text x="314.0" y="138.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">separate + ordinary zip + same dictionary</text><rect x="324.0" y="124.0" width="221.8" height="19.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="552.8" y="138.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">293,224 bytes</text><text x="314.0" y="170.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">all 256 blocks zipped together</text><rect x="324.0" y="156.0" width="189.1" height="19.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="520.1" y="170.0" font-size="12" text-anchor="start" font-weight="600" fill="#172d35">250,024 bytes  smallest</text><text x="24.0" y="204.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#53676c">256 small blocks (ZG-049). The special tricks beat ordinary zip with the same dictionary by only 809 bytes.</text></svg>