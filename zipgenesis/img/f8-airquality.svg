<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 393" width="800" height="393" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>Bar chart of bytes for air-quality test blocks under older tools, new column coding, and decoder cost.</title><rect width="800" height="393" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" text-anchor="start" font-weight="600" fill="#172d35">Air-quality tables: a clear win per block, a thin one once the decoder is counted</text><text x="24.0" y="66.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#53676c">Each block stored separately (16 test blocks)</text><text x="264.0" y="91.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">older ZipGenesis tools</text><rect x="274.0" y="78.0" width="329.4" height="17.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="610.4" y="91.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">29,941 bytes</text><text x="264.0" y="118.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new: each column on its own</text><rect x="274.0" y="105.0" width="224.0" height="17.0" rx="2" fill="#8fb0d6" stroke="none" stroke-width="1" /><text x="505.0" y="118.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">20,360 bytes</text><text x="264.0" y="145.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new: + links between columns</text><rect x="274.0" y="132.0" width="214.8" height="17.0" rx="2" fill="#3a6ea5" stroke="none" stroke-width="1" /><text x="495.8" y="145.0" font-size="12" text-anchor="start" font-weight="600" fill="#172d35">19,525 bytes  835 smaller (4.1%)</text><text x="24.0" y="179.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#53676c">All blocks stored together</text><text x="264.0" y="204.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">best earlier option</text><rect x="274.0" y="191.0" width="296.6" height="17.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="577.6" y="204.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">26,963 bytes</text><text x="264.0" y="231.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new: each column on its own</text><rect x="274.0" y="218.0" width="221.2" height="17.0" rx="2" fill="#8fb0d6" stroke="none" stroke-width="1" /><text x="502.2" y="231.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">20,110 bytes</text><text x="264.0" y="258.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new: + links between columns</text><rect x="274.0" y="245.0" width="211.1" height="17.0" rx="2" fill="#3a6ea5" stroke="none" stroke-width="1" /><text x="492.1" y="258.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">19,195 bytes</text><text x="24.0" y="292.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#53676c">Counting the decoder program as well (7,365 bytes)</text><text x="264.0" y="317.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">best earlier option</text><rect x="274.0" y="304.0" width="296.6" height="17.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="577.6" y="317.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">26,963 bytes</text><defs><pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f1f3f1"/><rect width="2.4" height="6" fill="#a9b6b5"/></pattern></defs><text x="264.0" y="344.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new + links + decoder</text><rect x="274.0" y="331.0" width="211.1" height="17.0" rx="2" fill="#3a6ea5" stroke="none" stroke-width="1" /><rect x="485.1" y="331.0" width="81.0" height="17.0" rx="2" fill="url(#hd)" stroke="none" stroke-width="1" /><text x="573.2" y="344.0" font-size="12" text-anchor="start" font-weight="600" fill="#172d35">26,560 bytes  only 403 smaller</text><text x="379.6" y="363.0" font-size="11" text-anchor="middle" font-weight="400" fill="#53676c">data</text><text x="525.7" y="363.0" font-size="11" text-anchor="middle" font-weight="400" fill="#53676c">decoder</text><text x="24.0" y="381.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#53676c">Test ZG-073, air-quality data (UCI). Shorter bar = smaller. Every block was rebuilt byte-for-byte.</text></svg>