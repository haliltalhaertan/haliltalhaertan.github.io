<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 327" width="800" height="327" role="img" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif"><title>Bar chart of bytes for wine-quality blocks; plain DEFLATE of the whole set is smallest.</title><rect width="800" height="327" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" text-anchor="start" font-weight="600" fill="#172d35">Wine tables: only 144 bytes gained per file, and zipping all together wins outright</text><text x="24.0" y="66.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#53676c">Each file stored separately (16 test blocks)</text><text x="264.0" y="91.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">older ZipGenesis tools</text><rect x="274.0" y="78.0" width="277.2" height="17.0" rx="2" fill="#a9b6b5" stroke="none" stroke-width="1" /><text x="558.2" y="91.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">18,313 bytes</text><text x="264.0" y="118.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new: each column on its own</text><rect x="274.0" y="105.0" width="269.9" height="17.0" rx="2" fill="#8fb0d6" stroke="none" stroke-width="1" /><text x="550.9" y="118.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">17,835 bytes</text><text x="264.0" y="145.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new: stronger version + fallback</text><rect x="274.0" y="132.0" width="268.0" height="17.0" rx="2" fill="#8fb0d6" stroke="none" stroke-width="1" /><text x="549.0" y="145.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">17,705 bytes</text><text x="264.0" y="172.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new: + links between columns</text><rect x="274.0" y="159.0" width="265.8" height="17.0" rx="2" fill="#3a6ea5" stroke="none" stroke-width="1" /><text x="546.8" y="172.0" font-size="12" text-anchor="start" font-weight="600" fill="#172d35">17,561 bytes  144 smaller (0.8%)</text><text x="24.0" y="206.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#53676c">All blocks stored together</text><text x="264.0" y="231.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">plain zip of everything (DEFLATE)</text><rect x="274.0" y="218.0" width="227.4" height="17.0" rx="2" fill="#146b69" stroke="none" stroke-width="1" /><text x="508.4" y="231.0" font-size="12" text-anchor="start" font-weight="600" fill="#172d35">15,024 bytes  smallest</text><text x="264.0" y="258.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new: each column on its own</text><rect x="274.0" y="245.0" width="265.0" height="17.0" rx="2" fill="#8fb0d6" stroke="none" stroke-width="1" /><text x="546.0" y="258.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">17,511 bytes</text><text x="264.0" y="285.0" font-size="12" text-anchor="end" font-weight="400" fill="#172d35">new: + links between columns</text><rect x="274.0" y="272.0" width="262.2" height="17.0" rx="2" fill="#3a6ea5" stroke="none" stroke-width="1" /><text x="543.2" y="285.0" font-size="12" text-anchor="start" font-weight="400" fill="#53676c">17,321 bytes</text><text x="24.0" y="315.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#53676c">Test ZG-075: the same method, unchanged, on a second real source (Wine Quality, UCI).</text></svg>